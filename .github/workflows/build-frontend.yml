name: Build and commit frontend assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/legacy-site-crawler
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json
      - name: Commit compiled assets to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if ! git diff --cached --quiet; then
            git commit -m "build: commit production Vite assets for Node-free hosting"
            git push origin HEAD:feature/legacy-site-crawler
          fi
