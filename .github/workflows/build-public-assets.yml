name: Build public assets for Timeweb
on:
  push:
    branches: [feature/legacy-site-crawler]
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/build-public-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: timeweb-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Compile browser assets
        run: |
          npm run build
          test -s public/build/manifest.json
      - name: Commit compiled assets into public/build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if ! git diff --cached --quiet; then
            git commit -m "build: update compiled public assets [skip ci]"
            git push
          fi
